spring.application.name=backend
spring.config.import=optional:file:./local.properties

# defaults match the local database for development only
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:bounce002}
spring.datasource.username=${DB_USER:bounce}
spring.datasource.password=${DB_PASSWORD:bounce_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.error.include-message=always
management.endpoints.web.exposure.include=health

# the club's local time zone, used for opening hours and "on the hour" checks
bounce.timezone=Asia/Kolkata
# the frontend address: allowed to call this API, and used in emailed links
bounce.cors-origin=http://localhost:5173
bounce.frontend-url=http://localhost:5173
